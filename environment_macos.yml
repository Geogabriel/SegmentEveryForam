# Conda environment for macOS on Apple Silicon (M-series) Macs.
# tensorflow-metal lets TensorFlow use the Mac's GPU; it supports
# TensorFlow up to 2.18, hence the version limit below.
#
#   conda env create -f environment_macos.yml
#   conda activate segmenteveryforam
name: segmenteveryforam

channels:
  - conda-forge

dependencies:
  - python=3.10
  - numpy
  - matplotlib
  - pyqt
  - pandas
  - geopandas
  - jupyterlab
  - scipy
  - scikit-image
  - scikit-learn
  - tqdm
  - networkx
  - shapely
  - pip
  - pip:
    - pillow
    - rasterio
    - opencv-python
    - rtree
    - tensorflow<=2.18.1
    - tensorflow-metal
    - torch
    - torchvision
    - sam2
    - -e .
